<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同对比 - ContractAI</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="office-editor.css">
  <style>
    .compare-toolbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--gray6);border-bottom:1px solid var(--gray5);font-size:12px}
    .compare-toolbar button{padding:4px 10px;border:1px solid var(--gray5);border-radius:4px;background:#fff;font-size:11px;cursor:pointer;color:var(--ink)}
    .compare-toolbar button:hover{background:var(--gray7)}
    .compare-toolbar .gold-btn{background:var(--gold-gradient);color:#fff;border:none;font-weight:600}
    .compare-split{display:grid;grid-template-columns:1fr 1fr;flex:1;overflow:hidden}
    .compare-pane{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--gray5)}
    .compare-pane:last-child{border-right:none}
    .compare-pane .pane-header{padding:8px 14px;background:#fafbfc;border-bottom:1px solid var(--gray5);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}
    .compare-pane .pane-content{flex:1;overflow-y:auto;padding:16px 24px;font-family:var(--font-serif);font-size:13px;line-height:1.9}
    .upload-zone-half{border:2px dashed var(--gray5);border-radius:var(--r-sm);padding:30px;text-align:center;cursor:pointer;margin:20px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .upload-zone-half:hover{border-color:var(--gold);background:var(--gold-bg)}
    /* Diff highlight markers */
    .diff-del{background:rgba(184,84,80,.12);border-left:3px solid var(--red);padding:2px 8px;border-radius:0 4px 4px 0;display:inline;position:relative;box-shadow:inset 0 0 0 1px rgba(184,84,80,.08)}
    .diff-add{background:rgba(90,138,106,.12);border-left:3px solid var(--green);padding:2px 8px;border-radius:0 4px 4px 0;display:inline;position:relative;box-shadow:inset 0 0 0 1px rgba(90,138,106,.08)}
    .diff-mod{background:rgba(196,122,32,.1);border-left:3px solid var(--amber);padding:2px 8px;border-radius:0 4px 4px 0;display:inline;position:relative;box-shadow:inset 0 0 0 1px rgba(196,122,32,.08)}
    /* Sequence badges */
    .diff-seq{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;margin-right:4px;vertical-align:middle;line-height:14px;color:#fff;pointer-events:none;position:relative;top:-1px}
    .diff-del .diff-seq{background:var(--red)}
    .diff-add .diff-seq{background:var(--green)}
    .diff-mod .diff-seq{background:var(--amber)}
    .diff-line{display:block;padding:2px 0;min-height:1.9em;position:relative}
    .diff-line:hover{background:rgba(0,0,0,.02);border-radius:3px}
    .diff-desc{font-size:11px;color:var(--muted);margin-left:8px;font-style:italic}
    /* Fallback appended items */
    .diff-fallback{margin:8px 0;padding:6px 10px;border:1px dashed var(--gray5);border-radius:4px;font-size:12px;color:var(--muted)}
    /* Diff summary bar */
    .compare-summary{padding:8px 14px;background:rgba(0,0,0,.03);border-bottom:1px solid var(--gray5);font-size:12px;color:var(--muted);line-height:1.6}
    .compare-summary strong{color:var(--ink)}
  </style>
</head>
<body>
<div class="ai-status-bar">
  <div class="status-left"><span class="status-dot" id="aiDot"></span><span>AI</span><span class="model-info" id="aiModel">检测中...</span></div>
  <div class="status-right" id="aiProvider"><a href="my-contracts.html">我的合同</a></div>
</div>
<div class="app-layout">
  <aside class="app-sidebar">
    <a class="brand" href="home.html"><div class="logo">AI</div><div class="text"><strong>ContractAI</strong><small>智能合同管理平台</small></div></a>
<nav>
      <div class="nav-group">
        <div class="nav-group-label">合同起草</div>
        <a class="nav-item" href="smart-draft.html"><span class="app-icon" id="navSD"></span><span>智能起草</span></a>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <a class="nav-item" href="contract-review.html"><span class="app-icon" id="navCR"></span><span>合同审查</span></a>
        <a class="nav-item" href="contract-compare.html"><span class="app-icon" id="navCC"></span><span>合同对比</span></a>
        <a class="nav-item" href="contract-templates.html"><span class="app-icon" id="navCT"></span><span>合同模板</span></a>
        <a class="nav-item" href="knowledge.html"><span class="app-icon" id="navKB"></span><span>知识库</span></a>
      </div>
    </nav>
  </aside>
  <div class="app-main">
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="compare-toolbar">
        <button onclick="document.getElementById('cmpFileA').click()">上传左文档</button>
        <input type="file" id="cmpFileA" accept=".doc,.docx,.txt" style="display:none" onchange="loadCompareFile('A',this.files[0])">
        <button onclick="document.getElementById('cmpFileB').click()">上传右文档</button>
        <input type="file" id="cmpFileB" accept=".doc,.docx,.txt" style="display:none" onchange="loadCompareFile('B',this.files[0])">
        <div style="flex:1"></div>
        <button class="gold-btn" onclick="runCompare()">AI 对比分析</button>
      </div>
      <div class="compare-summary" id="compareSummary" style="display:none"></div>
      <div class="compare-split" id="compareSplit">
        <div class="compare-pane" id="paneA">
          <div class="pane-header"><span id="labelA">文档 A（原始版本）</span><span id="diffCountA" style="color:var(--muted);font-weight:400"></span></div>
          <div class="pane-content" id="contentA">
            <div class="upload-zone-half" onclick="document.getElementById('cmpFileA').click()">
              <div style="font-size:24px;margin-bottom:8px;color:var(--muted)">📄</div>
              <div style="font-size:13px;color:var(--muted)">点击上传原始合同</div>
            </div>
          </div>
        </div>
        <div class="compare-pane" id="paneB">
          <div class="pane-header"><span id="labelB">文档 B（修改版本）</span><span id="diffCountB" style="color:var(--muted);font-weight:400"></span></div>
          <div class="pane-content" id="contentB">
            <div class="upload-zone-half" onclick="document.getElementById('cmpFileB').click()">
              <div style="font-size:24px;margin-bottom:8px;color:var(--muted)">📄</div>
              <div style="font-size:13px;color:var(--muted)">点击上传修改后合同</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="icons.js"></script>
<script src="model-test.js"></script>
<script>
let cmpTextA="",cmpTextB="",cmpHtmlA="",cmpHtmlB="";
window.addEventListener("DOMContentLoaded",()=>{
  const icons={navSD:"smartDraft",navCR:"contractReview",navMC:"fileText",navCC:"layers",navCT:"templateFill",navKB:"knowledge"};
  for(const[id,n]of Object.entries(icons)){const el=document.getElementById(id);if(el&&window.AppIcons)el.innerHTML=AppIcons[n]||"";}
  fetch("/api/health").then(r=>r.json()).then(d=>{
    document.getElementById("aiModel").textContent=d.model||"unknown";
    document.getElementById("aiProvider").textContent=d.provider||"";
    document.getElementById("aiDot").style.background=d.apiKeyConfigured?"var(--green)":"var(--red)";
  }).catch(()=>{document.getElementById("aiModel").textContent="离线";});
  initModelTest();
  // Sync scroll
  const paneA=document.getElementById("contentA");
  const paneB=document.getElementById("contentB");
  let syncing=false;
  if(paneA&&paneB){
    paneA.addEventListener("scroll",()=>{if(!syncing){syncing=true;paneB.scrollTop=paneA.scrollTop;syncing=false;}});
    paneB.addEventListener("scroll",()=>{if(!syncing){syncing=true;paneA.scrollTop=paneB.scrollTop;syncing=false;}});
  }
});

async function loadCompareFile(side,file){
  if(!file)return;
  const label=document.getElementById("label"+side);
  const content=document.getElementById("content"+side);
  label.textContent=file.name;
  content.innerHTML="<div style='padding:20px;text-align:center;color:var(--muted)'>解析中...</div>";
  if(file.name.match(/\.docx?$/i)){
    const fd=new FormData();fd.append("contractFile",file);
    try{
      const res=await fetch("/api/contracts/parse",{method:"POST",body:fd});
      const txt=await res.text();let data;try{data=JSON.parse(txt);}catch{throw new Error("解析失败");}
      if(data.error)throw new Error(data.error);
      if(side==="A"){cmpTextA=data.contractText||data.text||"";cmpHtmlA=data.contractHtml||"";}
      else{cmpTextB=data.contractText||data.text||"";cmpHtmlB=data.contractHtml||"";}
      const displayText=side==="A"?cmpTextA:cmpTextB;
      const displayHtml=side==="A"?cmpHtmlA:cmpHtmlB;
      if(displayHtml&&displayHtml.length>50){
        content.innerHTML=`<div style="font-family:var(--font-serif);font-size:13px;line-height:1.9">${displayHtml}</div>`;
      }else if(displayText){
        content.innerHTML=`<pre style="white-space:pre-wrap;font-family:var(--font-serif);font-size:13px;line-height:1.9">${esc(displayText)}</pre>`;
      }else{
        content.innerHTML="<div style='color:var(--red)'>未能解析文件内容</div>";
      }
    }catch(e){content.innerHTML="<div style='color:var(--red)'>"+esc(e.message)+"</div>";}
  }else{
    const text=await file.text();
    if(side==="A")cmpTextA=text;else cmpTextB=text;
    content.innerHTML=`<pre style="white-space:pre-wrap;font-family:var(--font-serif);font-size:13px;line-height:1.9">${esc(text)}</pre>`;
  }
}

async function runCompare(){
  if(!cmpTextA||!cmpTextB)return alert("请先上传两份合同");
  const contentA=document.getElementById("contentA");
  const contentB=document.getElementById("contentB");
  const summary=document.getElementById("compareSummary");
  contentA.innerHTML="<div style='padding:20px;text-align:center;color:var(--muted)'>AI 对比分析中...</div>";
  contentB.innerHTML="<div style='padding:20px;text-align:center;color:var(--muted)'>AI 对比分析中...</div>";
  summary.style.display="none";
  try{
    const res=await fetch("/api/contracts/compare",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({textA:cmpTextA,textB:cmpTextB})});
    const txt=await res.text();let data;try{data=JSON.parse(txt);}catch{throw new Error("服务器异常");}
    if(data.error)throw new Error(data.error);
    const diffs=data.diffs||[];
    // Show summary
    if(data.summary||diffs.length){
      const parts=[];
      if(diffs.length)parts.push("<strong>"+diffs.length+" 处差异</strong>");
      // Count by type
      const counts={modified:0,added:0,deleted:0};
      diffs.forEach(d=>{const t=d.type||"modified";if(counts[t]!==undefined)counts[t]++;});
      if(counts.modified)parts.push("修改 "+counts.modified+" 处");
      if(counts.added)parts.push("新增 "+counts.added+" 处");
      if(counts.deleted)parts.push("缺失 "+counts.deleted+" 处");
      if(data.summary)parts.push(data.summary);
      summary.innerHTML=parts.join(" · ");
      summary.style.display="";
    }
    // Display with inline diff annotations on both sides
    contentA.innerHTML=highlightDiff(cmpTextA,diffs,"A");
    contentB.innerHTML=highlightDiff(cmpTextB,diffs,"B");
    // Re-sync scroll
    let syncing=false;
    contentA.onscroll=()=>{if(!syncing){syncing=true;contentB.scrollTop=contentA.scrollTop;syncing=false;}};
    contentB.onscroll=()=>{if(!syncing){syncing=true;contentA.scrollTop=contentB.scrollTop;syncing=false;}};
  }catch(e){
    contentA.innerHTML=`<div style="color:var(--red);padding:20px">${esc(e.message)}</div>`;
    contentB.innerHTML=`<div style="color:var(--red);padding:20px">${esc(e.message)}</div>`;
  }
}

/* Render text with inline diff annotations — line-based approach.
   Each line wrapped in a block element; matching lines get colored highlights + numbered badges. */
function highlightDiff(text,diffs,side){
  if(!diffs||!diffs.length)return `<div style="font-family:var(--font-serif);font-size:13px;line-height:1.9;white-space:pre-wrap">${esc(text)}</div>`;
  const lines=(text||"").split("\n");
  const norm=s=>(s||"").replace(/\s+/g,"").toLowerCase();
  // Pre-build: for each line, which diff indices match it
  const lineDiffs=lines.map(()=>[]);
  const appended=[];
  diffs.forEach((d,di)=>{
    const orig=d.original||"";
    if(!orig)return;
    const type=d.type||"modified";
    // Filter by side
    if(side==="A"&&(type==="added"))return;
    if(side==="B"&&(type==="deleted"))return;
    const norig=norm(orig);
    let matched=false;
    for(let li=0;li<lines.length;li++){
      if(norm(lines[li]).includes(norig)||norig.includes(norm(lines[li]))){
        lineDiffs[li].push(di);
        matched=true;
        break;
      }
    }
    if(!matched){
      appended.push(di);
    }
  });
  // Build output — each line is a <span class="diff-line"> for proper block display
  const out=[];
  lines.forEach((line,li)=>{
    const ds=lineDiffs[li];
    if(!ds.length){
      out.push(`<span class="diff-line">${esc(line)||"&nbsp;"}</span>`);
      return;
    }
    // Use first matching diff for styling
    const d0=diffs[ds[0]];
    const type=d0.type||"modified";
    let cls;
    if(side==="A")cls=type==="deleted"?"diff-del":"diff-mod";
    else cls=type==="added"?"diff-add":"diff-mod";
    const seq=ds[0]+1;
    let labelText=type==="deleted"?seq+" 缺失":type==="added"?seq+" 新增":seq+" 修改";
    const desc=d0.description||"";
    const descHtml=desc?`<span class="diff-desc">— ${esc(desc)}</span>`:"";
    // For right side modified: try to show revised text inline
    if(side==="B"&&type==="modified"&&d0.revised){
      // Find which part of the line matches the original, replace with revised
      const nline=norm(line);
      const norig=norm(d0.original);
      const pos=nline.indexOf(norig);
      if(pos>=0){
        // Map normalized position back to raw position
        let ri=0,ni=0;
        while(ri<line.length&&ni<pos){if(/\s/.test(line[ri]))ri++;else{ri++;ni++;}}
        const startRi=ri;
        ni=0;
        while(ri<line.length&&ni<norig.length){if(/\s/.test(line[ri]))ri++;else{ri++;ni++;}}
        const before=esc(line.slice(0,startRi));
        const after=esc(line.slice(ri));
        out.push(`<span class="diff-line ${cls}"><span class="diff-seq">${esc(labelText)}</span>${before}<span style="text-decoration:underline dotted var(--amber)">${esc(d0.revised)}</span>${after}${descHtml}</span>`);
        return;
      }
    }
    // For right side added: show the added text highlighted
    if(side==="B"&&type==="added"&&d0.revised){
      out.push(`<span class="diff-line ${cls}"><span class="diff-seq">${esc(labelText)}</span>${esc(d0.revised)}${descHtml}</span>`);
      return;
    }
    out.push(`<span class="diff-line ${cls}"><span class="diff-seq">${esc(labelText)}</span>${esc(line)}${descHtml}</span>`);
  });
  // Append unmatched items at bottom
  if(appended.length){
    const items=appended.map(di=>{
      const d=diffs[di];
      const type=d.type||"modified";
      const seq=di+1;
      let labelText=type==="deleted"?seq+" 缺失":type==="added"?seq+" 新增":seq+" 修改";
      const cls=type==="deleted"?"diff-del":type==="added"?"diff-add":"diff-mod";
      const tip=d.description?`<span class="diff-desc">— ${esc(d.description)}</span>`:"";
      const content=side==="B"&&d.revised?d.revised:d.original;
      return `<span class="diff-line"><span class="${cls}"><span class="diff-seq">${esc(labelText)}</span>${esc(content)}${tip}</span></span>`;
    });
    out.push(`<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--gray5)"><div style="font-size:11px;color:var(--muted);margin-bottom:6px">${side==="B"?"⬆ 新增内容：":"⬇ 缺失内容："}</div>${items.join("")}</div>`);
  }
  return `<div style="font-family:var(--font-serif);font-size:13px;line-height:1.9">${out.join("")}</div>`;
}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
</body>
</html>
