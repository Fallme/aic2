<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同对比 - ContractAI</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="office-editor.css">
  <style>
    .compare-toolbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--gray6);border-bottom:1px solid var(--gray5);font-size:12px}
    .compare-toolbar button{padding:4px 10px;border:1px solid var(--gray5);border-radius:4px;background:#fff;font-size:11px;cursor:pointer;color:var(--ink)}
    .compare-toolbar button:hover{background:var(--gray7)}
    .compare-toolbar .gold-btn{background:var(--gold-gradient);color:#fff;border:none;font-weight:600}
    .compare-split{display:grid;grid-template-columns:1fr 1fr;flex:1;overflow:hidden}
    .compare-pane{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--gray5)}
    .compare-pane:last-child{border-right:none}
    .compare-pane .pane-header{padding:8px 14px;background:#fafbfc;border-bottom:1px solid var(--gray5);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}
    .compare-pane .pane-content{flex:1;overflow-y:auto;padding:16px 24px;font-family:var(--font-serif);font-size:13px;line-height:1.9}
    .diff-add{background:rgba(90,138,106,.1);border-left:3px solid var(--green);padding:2px 6px;border-radius:0 3px 3px 0}
    .diff-del{background:rgba(184,84,80,.1);border-left:3px solid var(--red);padding:2px 6px;border-radius:0 3px 3px 0;text-decoration:line-through}
    .diff-mod{background:rgba(196,122,32,.08);border-left:3px solid var(--amber);padding:2px 6px;border-radius:0 3px 3px 0}
    .upload-zone-half{border:2px dashed var(--gray5);border-radius:var(--r-sm);padding:30px;text-align:center;cursor:pointer;margin:20px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .upload-zone-half:hover{border-color:var(--gold);background:var(--gold-bg)}
  </style>
</head>
<body>
<div class="ai-status-bar">
  <div class="status-left"><span class="status-dot" id="aiDot"></span><span>AI</span><span class="model-info" id="aiModel">检测中...</span></div>
  <div class="status-right" id="aiProvider"><a href="my-contracts.html">我的合同</a></div>
</div>
<div class="app-layout">
  <aside class="app-sidebar">
    <a class="brand" href="home.html"><div class="logo">AI</div><div class="text"><strong>ContractAI</strong><small>智能合同管理平台</small></div></a>
<nav>
      <div class="nav-group">
        <div class="nav-group-label">合同起草</div>
        <a class="nav-item" href="smart-draft.html"><span class="app-icon" id="navSD"></span><span>智能起草</span></a>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <a class="nav-item" href="contract-review.html"><span class="app-icon" id="navCR"></span><span>合同审查</span></a>
        <a class="nav-item" href="contract-compare.html"><span class="app-icon" id="navCC"></span><span>合同对比</span></a>
        <a class="nav-item" href="contract-templates.html"><span class="app-icon" id="navCT"></span><span>合同模板</span></a>
        <a class="nav-item" href="knowledge.html"><span class="app-icon" id="navKB"></span><span>知识库</span></a>
      </div>
    </nav>
  </aside>
  <div class="app-main">
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="compare-toolbar">
        <button onclick="document.getElementById('cmpFileA').click()">上传左文档</button>
        <input type="file" id="cmpFileA" accept=".doc,.docx,.txt" style="display:none" onchange="loadCompareFile('A',this.files[0])">
        <button onclick="document.getElementById('cmpFileB').click()">上传右文档</button>
        <input type="file" id="cmpFileB" accept=".doc,.docx,.txt" style="display:none" onchange="loadCompareFile('B',this.files[0])">
        <div style="flex:1"></div>
        <button class="gold-btn" onclick="runCompare()">AI 对比分析</button>
      </div>
      <div class="compare-split" id="compareSplit">
        <div class="compare-pane" id="paneA">
          <div class="pane-header"><span id="labelA">文档 A（原始版本）</span><span id="diffCountA" style="color:var(--muted);font-weight:400"></span></div>
          <div class="pane-content" id="contentA">
            <div class="upload-zone-half" onclick="document.getElementById('cmpFileA').click()">
              <div style="font-size:24px;margin-bottom:8px;color:var(--muted)">📄</div>
              <div style="font-size:13px;color:var(--muted)">点击上传原始合同</div>
            </div>
          </div>
        </div>
        <div class="compare-pane" id="paneB">
          <div class="pane-header"><span id="labelB">文档 B（修改版本）</span><span id="diffCountB" style="color:var(--muted);font-weight:400"></span></div>
          <div class="pane-content" id="contentB">
            <div class="upload-zone-half" onclick="document.getElementById('cmpFileB').click()">
              <div style="font-size:24px;margin-bottom:8px;color:var(--muted)">📄</div>
              <div style="font-size:13px;color:var(--muted)">点击上传修改后合同</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="icons.js"></script>
<script src="model-test.js"></script>
<script>
let cmpTextA="",cmpTextB="",cmpHtmlA="",cmpHtmlB="";
window.addEventListener("DOMContentLoaded",()=>{
  const icons={navSD:"smartDraft",navCR:"contractReview",navMC:"fileText",navCC:"layers",navCT:"templateFill",navKB:"knowledge"};
  for(const[id,n]of Object.entries(icons)){const el=document.getElementById(id);if(el&&window.AppIcons)el.innerHTML=AppIcons[n]||"";}
  fetch("/api/health").then(r=>r.json()).then(d=>{
    document.getElementById("aiModel").textContent=d.model||"unknown";
    document.getElementById("aiProvider").textContent=d.provider||"";
    document.getElementById("aiDot").style.background=d.apiKeyConfigured?"var(--green)":"var(--red)";
  }).catch(()=>{document.getElementById("aiModel").textContent="离线";});
  initModelTest();
  // Sync scroll
  const paneA=document.getElementById("contentA");
  const paneB=document.getElementById("contentB");
  let syncing=false;
  paneA.addEventListener("scroll",()=>{if(!syncing){syncing=true;paneB.scrollTop=paneA.scrollTop;syncing=false;}});
  paneB.addEventListener("scroll",()=>{if(!syncing){syncing=true;paneA.scrollTop=paneB.scrollTop;syncing=false;}});
});

async function loadCompareFile(side,file){
  if(!file)return;
  const label=document.getElementById("label"+side);
  const content=document.getElementById("content"+side);
  label.textContent=file.name;
  content.innerHTML="<div style='padding:20px;text-align:center;color:var(--muted)'>解析中...</div>";
  if(file.name.match(/\.docx?$/i)){
    const fd=new FormData();fd.append("contractFile",file);
    try{
      const res=await fetch("/api/contracts/parse",{method:"POST",body:fd});
      const txt=await res.text();let data;try{data=JSON.parse(txt);}catch{throw new Error("解析失败");}
      if(side==="A"){cmpTextA=data.contractText||data.text||"";cmpHtmlA=data.contractHtml||"";}
      else{cmpTextB=data.contractText||data.text||"";cmpHtmlB=data.contractHtml||"";}
      content.innerHTML=cmpHtmlA||cmpHtmlB?`<div style="font-family:var(--font-serif);font-size:13px;line-height:1.9">${side==="A"?cmpHtmlA:cmpHtmlB}</div>`:`<pre style="white-space:pre-wrap;font-family:var(--font-serif);font-size:13px;line-height:1.9">${esc(side==="A"?cmpTextA:cmpTextB)}</pre>`;
    }catch(e){content.innerHTML="<div style='color:var(--red)'>"+esc(e.message)+"</div>";}
  }else{
    const text=await file.text();
    if(side==="A")cmpTextA=text;else cmpTextB=text;
    content.innerHTML=`<pre style="white-space:pre-wrap;font-family:var(--font-serif);font-size:13px;line-height:1.9">${esc(text)}</pre>`;
  }
}

async function runCompare(){
  if(!cmpTextA||!cmpTextB)return alert("请先上传两份合同");
  const contentA=document.getElementById("contentA");
  const contentB=document.getElementById("contentB");
  contentA.innerHTML="<div style='padding:20px;text-align:center;color:var(--muted)'>AI 对比分析中...</div>";
  contentB.innerHTML="<div style='padding:20px;text-align:center;color:var(--muted)'>AI 对比分析中...</div>";
  try{
    const res=await fetch("/api/contracts/compare",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({textA:cmpTextA,textB:cmpTextB})});
    const txt=await res.text();let data;try{data=JSON.parse(txt);}catch{throw new Error("服务器异常");}
    if(data.error)throw new Error(data.error);
    // Display with diff highlights
    contentA.innerHTML=highlightDiff(cmpTextA,data.diffs||[],"A");
    contentB.innerHTML=highlightDiff(cmpTextB,data.diffs||[],"B");
    document.getElementById("diffCountA").textContent=(data.diffs||[]).length+" 处差异";
  }catch(e){
    contentA.innerHTML=`<div style="color:var(--red);padding:20px">${esc(e.message)}</div>`;
    contentB.innerHTML=`<div style="color:var(--red);padding:20px">${esc(e.message)}</div>`;
  }
}

function highlightDiff(text,diffs,side){
  if(!diffs.length)return `<pre style="white-space:pre-wrap;font-family:var(--font-serif);font-size:13px;line-height:1.9">${esc(text)}</pre>`;
  let html=text;
  diffs.forEach(d=>{
    const cls=side==="A"?"diff-del":"diff-add";
    if(d.original&&html.includes(d.original.slice(0,30))){
      html=html.replace(d.original.slice(0,30),`<span class="${cls}">${esc(d.original.slice(0,30))}</span>`);
    }
  });
  return `<div style="font-family:var(--font-serif);font-size:13px;line-height:1.9;white-space:pre-wrap">${html}</div>`;
}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
</body>
</html>
