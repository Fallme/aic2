<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合同对比 - ContractAI</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="knowledge.css">
  <link rel="stylesheet" href="office-editor.css">
  <style>
  /* ===== PATCH v3.2: prominent inline annotations + drawer-block ===== */

  /* -- Grid layout: left + gutter + right -- */
  .compare-office-grid{display:grid;grid-template-columns:1fr 36px 1fr;gap:8px;min-height:0;flex:1;overflow:hidden}

  /* -- Gutter between panels -- */
  .compare-gutter{position:relative;background:var(--gray7,#f8f9fa);border-radius:8px;overflow:hidden;border:1px solid var(--gray5,#e5e7eb)}
  .compare-gutter::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;background:repeating-linear-gradient(to bottom,#d1d5db 0px,#d1d5db 4px,transparent 4px,transparent 8px);pointer-events:none}
  .compare-gutter-tick{position:absolute;left:50%;transform:translateX(-50%);width:22px;height:8px;border-radius:4px;cursor:pointer;transition:width .15s,opacity .15s;opacity:.85}
  .compare-gutter-tick:hover{width:30px;opacity:1}
  .compare-gutter-tick[data-category="party"]{background:#007aff}
  .compare-gutter-tick[data-category="missing"]{background:#ff3b30}
  .compare-gutter-tick[data-category="added"]{background:#34c759}
  .compare-gutter-tick[data-category="inconsistent"]{background:#ff9500}

  /* -- Highlight base: strong L-bracket border + visible bg -- */
  .diff-highlight{position:relative;display:inline;border-radius:2px;padding:1px 3px;scroll-margin-top:80px;transition:filter .15s,box-shadow .15s;font-weight:500}

  /* -- Type colors: stronger bg + thick L-bracket (left + bottom) -- */
  .diff-highlight.diff-changed,.diff-highlight.diff-inconsistent{background:rgba(255,149,0,.28);border-left:3px solid #ff9500;border-bottom:3px solid #ff9500}
  .diff-highlight.diff-missing,.diff-highlight.diff-removed{background:rgba(255,59,48,.25);border-left:3px solid #ff3b30;border-bottom:3px solid #ff3b30}
  .diff-highlight.diff-added{background:rgba(52,199,89,.25);border-left:3px solid #34c759;border-bottom:3px solid #34c759}
  .diff-highlight.diff-party{background:rgba(0,122,255,.22);border-left:3px solid #007aff;border-bottom:3px solid #007aff}

  /* -- Flag badge: bigger, bolder, inline pill -- */
  .diff-flag{display:inline-flex;align-items:center;height:22px;border-radius:5px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;pointer-events:none;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.18);overflow:hidden;max-width:140px;transition:transform .15s,box-shadow .15s;margin-right:5px;vertical-align:middle}
  .diff-flag-num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:100%;padding:0 6px;font-size:12px;font-weight:800;background:rgba(255,255,255,.28);letter-spacing:.3px}
  .diff-flag-type{display:inline-flex;align-items:center;height:100%;padding:0 8px;font-size:11px;font-weight:600}

  /* -- Hover correspondence: both sides glow -- */
  .diff-highlight-active{filter:brightness(.9);box-shadow:0 0 0 3px rgba(0,122,255,.3);border-radius:3px;z-index:3;position:relative}

  /* -- Gutter tick hover correspondence -- */
  .compare-gutter-tick.active{opacity:1;width:30px;filter:brightness(1.1)}

  /* -- Compare page layout -- */
  .compare-main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);margin-top:32px}
  .compare-hero{padding:14px 20px;background:#fff;border-bottom:1px solid var(--gray5);display:flex;align-items:center;gap:16px}
  .compare-hero h1{font-size:18px;font-weight:700;margin:0}
  .compare-hero .eyebrow{font-size:11px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .compare-hero p{font-size:12px;color:var(--gray3);margin:0}
  .compare-actions{display:flex;gap:8px;margin-left:auto}
  .compare-actions button{padding:6px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--gray5);background:#fff;color:var(--gray1);transition:all .15s}
  .compare-actions button:hover{border-color:var(--gold);color:var(--gold-dark)}
  .compare-actions .primary{background:var(--gold-gradient);color:#fff;border:none;font-weight:600}
  .compare-doc-card{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--gray5);border-radius:var(--r-md);background:#fff}
  .compare-card-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fafbfc;border-bottom:1px solid var(--gray5);font-size:12px}
  .compare-card-head span{font-weight:600}
  .compare-card-head strong{color:var(--gray3);font-weight:400;margin-left:8px}
  .compare-editor-wrapper{flex:1;overflow:hidden;position:relative}
  .compare-editor{height:100%;overflow-y:auto}
  .compare-editor .oe-editor{min-height:300px;padding:20px 24px;font-size:13px;line-height:1.9}
  .compare-hidden-text{display:none}
  .file-like-btn{padding:4px 10px;border:1px solid var(--gray5);border-radius:4px;font-size:11px;cursor:pointer;background:#fff;color:var(--gray1)}
  .file-like-btn:hover{border-color:var(--gold)}

  /* -- Drawer overlay + drawer -- */
  .compare-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
  .compare-drawer-overlay.visible{opacity:1;pointer-events:auto}
  .compare-drawer{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:#fff;z-index:210;box-shadow:-4px 0 24px rgba(0,0,0,.12);transition:right .3s ease;display:flex;flex-direction:column}
  .compare-drawer.open{right:0}
  .compare-drawer-head{padding:16px;border-bottom:1px solid var(--gray5);display:flex;justify-content:space-between;align-items:flex-start}
  .compare-drawer-head h2{font-size:16px;font-weight:700;margin:0 0 4px}
  .compare-drawer-head p{font-size:12px;color:var(--gray3);margin:0}
  .compare-drawer-close-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray3);padding:4px}
  .compare-drawer-close-btn:hover{color:var(--gray1)}
  .compare-stat-row{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--gray5);font-size:11px}
  .compare-stat-row span{padding:3px 8px;border-radius:4px;font-weight:500}
  .stat-party{background:var(--blue-bg);color:#4a6fa5}
  .stat-missing{background:var(--red-bg);color:var(--red)}
  .stat-added{background:var(--green-bg);color:var(--green)}
  .stat-inconsistent{background:var(--amber-bg);color:var(--amber)}
  .compare-drawer-body{flex:1;overflow-y:auto;padding:16px}
  .bubble-annotation-list .empty-state{color:var(--gray3);font-size:13px;text-align:center;padding:40px 20px}

  /* ===== END PATCH STYLES ===== */
  </style>
</head>

<script>
/* ===== PATCH v3.2: inline annotations + drawer-block ===== */
(function(){

  /* ---- clearAnnotations ---- */
  function clearAnnotations(){
    [els.leftEditor, els.rightEditor].forEach(function(editor){
      if(!editor) return;
      var oe = editor.querySelector ? editor.querySelector('.oe-editor') : editor;
      if(!oe) return;
      oe.querySelectorAll('.diff-flag').forEach(function(f){ f.remove(); });
      oe.querySelectorAll('.diff-highlight').forEach(function(s){
        var p = s.parentNode; if(!p) return;
        while(s.firstChild) p.insertBefore(s.firstChild, s);
        p.removeChild(s);
      });
    });
    var gutter = document.getElementById('compare-gutter');
    if(gutter) gutter.querySelectorAll('.compare-gutter-tick').forEach(function(t){ t.remove(); });
  }
  window.clearAnnotations = clearAnnotations;

  /* ---- _highlightInEditor: chunk-based search → flag badge ---- */
  window._highlightInEditor = function(editor, raw, seq, label, addBadge, category){
    if(!editor) return;
    var rawTrimmed = String(raw||"").trim();
    if(!rawTrimmed || rawTrimmed.length < 4) return;
    var oe = editor.querySelector ? editor.querySelector('.oe-editor') : editor;
    if(!oe) return;
    var searchStr = rawTrimmed.replace(/\s+/g,'');
    var chunkSizes = [18, 10];
    for(var si = 0; si < chunkSizes.length; si++){
      var chunkLen = chunkSizes[si];
      var stride = Math.max(chunkLen - 2, 4);
      for(var ci = 0; ci < searchStr.length; ci += stride){
        var chunk = searchStr.slice(ci, ci + chunkLen);
        if(chunk.length < 4) continue;
        var walker = document.createTreeWalker(oe, NodeFilter.SHOW_TEXT, {
          acceptNode: function(node){
            if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            if(node.parentElement && node.parentElement.closest(".diff-flag,.oe-toolbar,.oe-statusbar"))
              return NodeFilter.FILTER_REJECT;
            if(node.parentElement && node.parentElement.closest(".diff-highlight"))
              return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        var nodes = [];
        while(walker.nextNode()) nodes.push(walker.currentNode);
        for(var ni = 0; ni < nodes.length; ni++){
          var node = nodes[ni];
          var nodeText = node.nodeValue || "";
          var nodeNorm = nodeText.replace(/\s+/g,'');
          var idx = nodeNorm.indexOf(chunk);
          if(idx < 0) continue;
          var ri = 0, pi = 0;
          while(ri < nodeText.length && pi < idx){ if(/\s/.test(nodeText[ri])) ri++; else { ri++; pi++; } }
          var startRi = ri; pi = 0;
          while(ri < nodeText.length && pi < chunk.length){ if(/\s/.test(nodeText[ri])) ri++; else { ri++; pi++; } }
          try {
            var range = document.createRange();
            range.setStart(node, startRi);
            range.setEnd(node, Math.min(ri, nodeText.length));
            if(range.collapsed) continue;
            var matchedText = range.toString();
            if(!matchedText || matchedText.trim().length < 4) continue;

            var span = document.createElement("span");
            span.className = "diff-highlight" + (category ? " diff-" + category : "");
            span.setAttribute("data-diff-id", seq);
            span.textContent = matchedText;
            range.deleteContents();
            range.insertNode(span);

            if(addBadge){
              var flag = document.createElement("span");
              flag.className = "diff-flag";
              flag.setAttribute("data-diff-id", seq);
              flag.innerHTML = '<span class="diff-flag-num">'+seq+'</span><span class="diff-flag-type">'+label+'</span>';
              var flagColors = {party:"#007aff",missing:"#ff3b30",added:"#34c759",inconsistent:"#ff9500",changed:"#ff9500",removed:"#ff3b30"};
              flag.style.background = flagColors[category] || "#ff9500";
              if(span.parentNode) span.parentNode.insertBefore(flag, span);
            }
            return;
          } catch(e){ continue; }
        }
      }
    }
  };

  /* ---- annotateEditors: iterate diff items → highlight both sides ---- */
  window.annotateEditors = function(){
    clearAnnotations();
    if(!state || !state.diff || !state.diff.length) return;
    var visible = state.diff.filter(function(d){ return d.type !== "equal"; });
    if(!visible.length) return;
    var seq = 0;
    visible.forEach(function(item){
      seq++;
      var category = classifyDiff(item);
      var map = { party:"主体", missing:"缺失", added:"新增", inconsistent:"修改" };
      var catLabel = map[category] || "修改";
      if(item.type === "removed" || item.type === "changed" || category === "party"){
        var st = item.type === "changed" ? item.before : item.text;
        _highlightInEditor(els.leftEditor, st, seq, catLabel, true, category);
      }
      if(item.type === "added" || item.type === "changed" || category === "party"){
        var st2 = item.type === "changed" ? item.after : item.text;
        _highlightInEditor(els.rightEditor, st2, seq, catLabel, true, category);
      }
    });
    renderGutter();
  };

  /* ---- hover correspondence ---- */
  function highlightCorrespondence(id){
    document.querySelectorAll('.diff-highlight[data-diff-id="'+id+'"]').forEach(function(el){
      el.classList.add('diff-highlight-active');
      var flag = el.nextElementSibling;
      if(flag && flag.classList.contains('diff-flag')){
        flag.style.transform = 'translateY(-2px)';
        flag.style.boxShadow = '0 2px 8px rgba(0,0,0,.25)';
      }
    });
    document.querySelectorAll('.compare-gutter-tick[data-diff-id="'+id+'"]').forEach(function(el){
      el.classList.add('active');
    });
  }
  function clearCorrespondence(){
    document.querySelectorAll('.diff-highlight-active').forEach(function(el){
      el.classList.remove('diff-highlight-active');
      var flag = el.nextElementSibling;
      if(flag && flag.classList.contains('diff-flag')){
        flag.style.transform = '';
        flag.style.boxShadow = '';
      }
    });
    document.querySelectorAll('.compare-gutter-tick.active').forEach(function(el){
      el.classList.remove('active');
    });
  }
  window.highlightCorrespondence = highlightCorrespondence;
  window.clearCorrespondence = clearCorrespondence;

  /* ---- event delegation on editor wrappers ---- */
  function setupHoverListeners(){
    var wrappers = document.querySelectorAll('.compare-editor-wrapper');
    wrappers.forEach(function(wrapper){
      wrapper.addEventListener('mouseover', function(e){
        var target = e.target.closest('[data-diff-id]');
        if(!target) return;
        highlightCorrespondence(target.getAttribute('data-diff-id'));
      });
      wrapper.addEventListener('mouseout', function(e){
        var target = e.target.closest('[data-diff-id]');
        if(!target) return;
        clearCorrespondence();
      });
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', setupHoverListeners);
  } else {
    setupHoverListeners();
  }

  /* ---- left-right scroll sync ---- */
  var scrollSyncing = false;
  function syncScroll(source){
    if(scrollSyncing) return;
    scrollSyncing = true;
    var target = (source === els.leftEditor) ? els.rightEditor : els.leftEditor;
    if(target) target.scrollTop = source.scrollTop;
    renderGutter();
    scrollSyncing = false;
  }
  function setupScrollSync(){
    if(els.leftEditor) els.leftEditor.addEventListener('scroll', function(){ syncScroll(els.leftEditor); });
    if(els.rightEditor) els.rightEditor.addEventListener('scroll', function(){ syncScroll(els.rightEditor); });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', setupScrollSync);
  } else {
    setupScrollSync();
  }

  /* ---- renderGutter ---- */
  function renderGutter(){
    var gutter = document.getElementById('compare-gutter');
    if(!gutter) return;
    gutter.querySelectorAll('.compare-gutter-tick').forEach(function(t){ t.remove(); });
    if(!state || !state.diff || !state.diff.length) return;
    var visible = state.diff.filter(function(d){ return d.type !== "equal"; });
    if(!visible.length) return;
    var leftWrapper = els.leftEditor;
    var oeLeft = leftWrapper && leftWrapper.querySelector ? leftWrapper.querySelector('.oe-editor') : leftWrapper;
    if(!oeLeft) return;
    var gutterEl = gutter;
    var gutterRect = gutterEl.getBoundingClientRect();

    visible.forEach(function(item, idx){
      var seq = idx + 1;
      var category = classifyDiff(item);
      var highlight = oeLeft.querySelector('.diff-highlight[data-diff-id="'+seq+'"]');
      if(!highlight) return;
      var hRect = highlight.getBoundingClientRect();
      var scrollTop = leftWrapper.scrollTop || 0;
      var relativeTop = hRect.top - gutterRect.top + scrollTop;
      var tick = document.createElement('div');
      tick.className = 'compare-gutter-tick';
      tick.setAttribute('data-diff-id', seq);
      tick.setAttribute('data-category', category);
      tick.style.top = relativeTop + 'px';
      tick.addEventListener('mouseenter', function(){ highlightCorrespondence(seq.toString()); });
      tick.addEventListener('mouseleave', function(){ clearCorrespondence(); });
      gutterEl.appendChild(tick);
    });
  }
  window.renderGutter = renderGutter;

  /* ---- patch compareContracts: block drawer + retry annotations ---- */
  var origCompare = window.compareContracts;
  var origOpenDrawer = window.openDrawer;
  window.compareContracts = function(){
    /* ====== STEP 1: Neutralize openDrawer globally before calling orig ====== */
    window.openDrawer = function(){};
    /* MutationObserver backup */
    var _drawerObserver = null;
    function _startDrawerGuard(){
      var drawer = document.getElementById('compare-drawer');
      if(!drawer || _drawerObserver) return;
      _drawerObserver = new MutationObserver(function(){
        if(drawer.classList.contains('open')){
          drawer.classList.remove('open');
        }
      });
      _drawerObserver.observe(drawer, {attributes:true, attributeFilter:['class']});
    }
    _startDrawerGuard();
    function forceCloseDrawer(){
      var d = document.getElementById('compare-drawer');
      if(d) d.classList.remove('open');
      var o = document.getElementById('compare-drawer-overlay');
      if(o) o.classList.remove('visible');
      var p = document.getElementById('compare-popover');
      if(p) p.hidden = true;
    }
    /* ====== STEP 2: Run original comparison ====== */
    try { origCompare.call(this); } catch(e){ console.warn("[PATCH] origCompare error:", e); }
    /* ====== STEP 3: Close drawer + cleanup ====== */
    forceCloseDrawer();
    var toggleBtn = document.getElementById('compare-drawer-toggle-btn');
    if(toggleBtn) toggleBtn.hidden = true;
    setTimeout(forceCloseDrawer, 100);
    setTimeout(forceCloseDrawer, 300);
    setTimeout(forceCloseDrawer, 600);
    setTimeout(forceCloseDrawer, 1200);
    setTimeout(function(){
      if(origOpenDrawer) window.openDrawer = origOpenDrawer;
      if(_drawerObserver){ _drawerObserver.disconnect(); _drawerObserver = null; }
    }, 2000);
    /* ====== STEP 4: Retry annotations until both sides have highlights ====== */
    function retry(attempt){
      if(attempt > 8) return;
      setTimeout(function(){
        forceCloseDrawer();
        try { window.annotateEditors(); } catch(e){}
        var lH = els.leftEditor ? els.leftEditor.querySelectorAll(".diff-highlight").length : 0;
        var rH = els.rightEditor ? els.rightEditor.querySelectorAll(".diff-highlight").length : 0;
        if((lH === 0 || rH === 0) && attempt < 8) retry(attempt + 1);
        else {
          forceCloseDrawer();
          renderGutter();
        }
      }, 300 + attempt * 400);
    }
    retry(0);
  };
  console.log("[PATCH v3.2] inline annotations + drawer-block loaded");
})();
</script>
