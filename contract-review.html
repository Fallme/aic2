<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同审查 - ContractAI</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="office-editor.css">
  <style>
    /* ── Review-specific styles ── */
    .review-layout { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden; }
    .review-top { display: flex; gap: 12px; align-items: stretch; }
    .review-top .score-strip {
      display: flex; gap: 0; background: var(--glass-solid); border: 1px solid var(--glass-border);
      border-radius: var(--r-md); overflow: hidden; flex: 1;
    }
    .review-top .score-item {
      flex: 1; padding: 10px 14px; text-align: center; border-right: 1px solid var(--line);
    }
    .review-top .score-item:last-child { border-right: none; }
    .review-top .score-item .label { font-size: 11px; color: var(--muted); }
    .review-top .score-item .value { font-size: 18px; font-weight: 700; color: var(--ink); }
    .review-top .score-item .sub { font-size: 10px; color: var(--subtle); }
    .review-top .cmd-strip {
      display: flex; gap: 6px; align-items: center; background: var(--glass-solid);
      border: 1px solid var(--glass-border); border-radius: var(--r-md); padding: 8px 12px;
    }
    .review-board { display: grid; grid-template-columns: 1fr 360px; gap: 12px; flex: 1; min-height: 0; }
    .review-source, .review-issues-panel {
      background: var(--glass-solid); border: 1px solid var(--glass-border);
      border-radius: var(--r-md); display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-head-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--line);
    }
    .panel-head-bar h3 { font-size: 13px; font-weight: 600; }
    .panel-head-bar .actions { display: flex; gap: 6px; }
    .contract-source { flex: 1; overflow-y: auto; padding: 14px; font-family: var(--font-serif); font-size: 13px; line-height: 1.8; }
    .issue-list { flex: 1; overflow-y: auto; padding: 8px; }
    .issue-card {
      padding: 10px 12px; border-radius: var(--r-sm); border-left: 3px solid var(--line-strong);
      background: #fafafa; margin-bottom: 6px; cursor: pointer; transition: all 0.15s;
    }
    .issue-card:hover { background: #f3f4f6; transform: translateY(-1px); }
    .issue-card.high { border-left-color: var(--red); }
    .issue-card.mid { border-left-color: var(--amber); }
    .issue-card.low { border-left-color: var(--accent); }
    .issue-card .issue-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .issue-card .issue-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .issue-card .issue-basis { font-size: 11px; color: var(--subtle); margin-top: 4px; padding: 6px 8px; background: #f0f0f0; border-radius: 4px; }
    .issue-card .issue-actions { display: flex; gap: 4px; margin-top: 6px; }
    .issue-card .issue-actions button {
      padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line-strong);
      background: #fff; font-size: 11px; cursor: pointer;
    }
    .issue-card .issue-actions button:hover { border-color: var(--accent); }
    .filter-tabs { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    .filter-tabs button {
      flex: 1; padding: 5px 8px; border: none; border-radius: 4px;
      background: transparent; font-size: 11px; color: var(--muted); cursor: pointer;
    }
    .filter-tabs button.active { background: var(--accent-soft); color: var(--accent-hover); font-weight: 500; }
    .issue-nav { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .review-summary-bar {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: var(--glass-solid); border: 1px solid var(--glass-border); border-radius: var(--r-md);
    }
    .review-summary-bar p { flex: 1; font-size: 13px; color: var(--muted); }
    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 500;
    }
    .modal-box {
      background: #fff; border-radius: var(--r-lg); box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      width: 560px; max-height: 80vh; overflow-y: auto; padding: 24px;
    }
    .modal-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .modal-box .desc { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .modal-box textarea {
      width: 100%; min-height: 120px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
      padding: 10px; font-size: 13px; font-family: var(--font); resize: vertical; margin-bottom: 12px;
    }
    .modal-box textarea:focus { outline: none; border-color: var(--accent); }
    .modal-box .file-drop {
      border: 2px dashed var(--line-strong); border-radius: var(--r-md); padding: 20px;
      text-align: center; cursor: pointer; margin-bottom: 12px; transition: all 0.2s;
    }
    .modal-box .file-drop:hover { border-color: var(--accent); background: var(--accent-softer); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .risk-anno {
      position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px;
    }
    .risk-anno.high { background: var(--red); }
    .risk-anno.mid { background: var(--amber); }
    .risk-anno.low { background: var(--accent); }
    .source-line { position: relative; padding: 2px 0; }
    .source-line.highlight-high { background: rgba(239,68,68,0.08); }
    .source-line.highlight-mid { background: rgba(245,158,11,0.08); }
    .source-line.highlight-low { background: rgba(234,179,8,0.08); }
    .source-line.active { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
    .server-pill {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
      border-radius: var(--r-pill); font-size: 11px; font-weight: 500;
    }
    .server-pill.ok { background: var(--green-soft); color: #16a34a; }
    .server-pill.err { background: var(--red-soft); color: var(--red); }
    .empty-review {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 40px; text-align: center; color: var(--muted);
    }
    .empty-review .icon { width: 48px; height: 48px; color: var(--subtle); opacity: 0.4; margin-bottom: 12px; }
  </style>
</head>
<body>
<!-- AI Status Bar -->
<div class="ai-status-bar">
  <div class="status-left">
    <span class="status-dot" id="aiDot"></span>
    <span>AI 模型</span>
    <span class="model-info" id="aiModel">检测中...</span>
  </div>
  <div class="status-right" id="aiProvider"></div>
</div>

<div class="app-layout">
  <!-- Sidebar -->
  <aside class="app-sidebar">
    <a class="brand" href="home.html">
      <div class="logo">AI</div>
      <div class="text"><strong>ContractAI</strong><small>智能合同管理平台</small></div>
    </a>
    <nav>
      <div class="nav-group">
        <div class="nav-group-label">合同起草</div>
        <a class="nav-item" href="template-fill.html"><span class="app-icon" id="navTF"></span><span>模板填写</span></a>
        <a class="nav-item" href="smart-draft.html"><span class="app-icon" id="navSD"></span><span>智能起草</span></a>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <a class="nav-item active" href="contract-review.html"><span class="app-icon" id="navCR"></span><span>合同审查</span></a>
        <a class="nav-item" href="knowledge.html"><span class="app-icon" id="navKB"></span><span>知识库</span></a>
      </div>
    </nav>
  </aside>

  <!-- Main -->
  <div class="app-main">
    <div class="contract-panel" style="gap:10px">
      <!-- Top: Score + Commands -->
      <div class="review-top">
        <div class="score-strip" id="review-scoreboard">
          <div class="score-item"><div class="label">合同评分</div><div class="value" id="score-value">--</div></div>
          <div class="score-item"><div class="label">综合风险</div><div class="value" id="score-risk">待审查</div></div>
          <div class="score-item"><div class="label">风险问题</div><div class="value" id="score-issues">0</div><div class="sub" id="score-breakdown">高 0 / 中 0</div></div>
          <div class="score-item"><div class="label">审查点</div><div class="value" id="score-points">0</div></div>
          <div class="score-item"><div class="label">AI 审查</div><div class="value" id="score-ai">待调用</div></div>
        </div>
        <div class="cmd-strip">
          <button class="btn btn-outline btn-sm" onclick="openImport()">上传合同</button>
          <button class="btn btn-outline btn-sm" onclick="pasteText()">粘贴文本</button>
          <button class="btn btn-outline btn-sm" id="export-report-btn" disabled>导出报告</button>
          <button class="btn btn-primary btn-sm" id="review-btn" onclick="startReview()">开始审查</button>
        </div>
      </div>

      <!-- Summary -->
      <div class="review-summary-bar" id="review-summary">
        <span class="tag tag-accent" id="summary-tag">待审查</span>
        <p id="summary-text">审查完成后显示整体意见、综合风险和合同评分。</p>
      </div>

      <!-- Board: Source + Issues -->
      <div class="review-board">
        <!-- Source -->
        <div class="review-source">
          <div class="panel-head-bar">
            <h3>合同原文与标记</h3>
            <div class="actions">
              <button class="btn btn-ghost btn-sm" onclick="copySource()" id="copy-source-btn">复制原文</button>
              <button class="btn btn-primary btn-sm" onclick="downloadCorrected()">下载修改后</button>
            </div>
          </div>
          <div class="contract-source" id="review-editor-container">
            <div class="empty-review" id="empty-source">
              <div class="icon"><span class="app-icon" style="width:48px;height:48px" id="icoEmpty"></span></div>
              <p>上传合同后，原文将在此显示<br>风险片段会高亮标记</p>
            </div>
          </div>
        </div>

        <!-- Issues -->
        <div class="review-issues-panel">
          <div class="panel-head-bar">
            <h3>风险点和意见</h3>
            <button class="btn btn-ghost btn-sm" id="accept-all-btn" disabled>接受全部</button>
          </div>
          <div class="filter-tabs" id="review-filter-bar">
            <button class="active" data-review-filter="summary">审查结果</button>
            <button data-review-filter="risk">风险问题</button>
            <button data-review-filter="common">常见问题</button>
            <button data-review-filter="rule">规则库</button>
          </div>
          <div class="issue-list" id="review-issues">
            <div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">审查结果会按风险等级列出问题、依据和修改建议</div>
          </div>
          <div class="issue-nav" id="issue-nav" style="display:none">
            <button class="btn btn-ghost btn-sm" id="prev-issue-btn">上一个</button>
            <span id="issue-counter">0 / 0</span>
            <button class="btn btn-ghost btn-sm" id="next-issue-btn">下一个</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="review-import-modal" style="display:none">
  <div class="modal-box">
    <h3>导入待审合同</h3>
    <p class="desc">上传 Word/PDF/TXT，或直接粘贴合同文本。</p>
    <div class="file-drop" onclick="document.getElementById('review-file').click()">
      <span class="app-icon" style="width:24px;height:24px;color:var(--accent);margin-bottom:8px" id="icoUploadModal"></span>
      <div style="font-size:13px;color:var(--muted)">点击选择合同文件<br>支持 Word、PDF、TXT</div>
    </div>
    <input type="file" id="review-file" accept=".doc,.docx,.pdf,.txt,.md,.html,.json" style="display:none">
    <textarea id="review-import-text" placeholder="也可以直接粘贴合同全文..."></textarea>
    <textarea id="review-text" hidden></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeImport()">取消</button>
      <button class="btn btn-primary" onclick="confirmImport()">导入合同</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script>
// ── Review UI Controller (self-contained, no external deps) ──
let reviewContractText = "";
let reviewIssues = [];
let currentIssueIdx = 0;

window.addEventListener("DOMContentLoaded", () => {
  // Icons
  const icons = { navTF:"templateFill", navSD:"smartDraft", navCR:"contractReview", navKB:"knowledge" };
  for (const [id, name] of Object.entries(icons)) {
    const el = document.getElementById(id);
    if (el && window.AppIcons) el.innerHTML = AppIcons[name] || "";
  }
  // AI status
  fetch("/api/health").then(r=>r.json()).then(d=>{
    const m=document.getElementById("aiModel"), p=document.getElementById("aiProvider"), dot=document.getElementById("aiDot");
    if(m) m.textContent=d.model||"unknown";
    if(p) p.textContent=d.provider||"";
    if(dot) dot.style.background=d.apiKeyConfigured?"var(--green)":"var(--red)";
  }).catch(()=>{
    const m=document.getElementById("aiModel"), dot=document.getElementById("aiDot");
    if(m) m.textContent="离线";
    if(dot) dot.style.background="var(--red)";
  });
  // File input listener
  const fi = document.getElementById("review-file");
  if (fi) fi.addEventListener("change", () => { if(fi.files[0]) handleFile(fi.files[0]); fi.value=""; });
  // Filter tabs
  document.querySelectorAll(".filter-tabs button").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll(".filter-tabs button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
    });
  });
});

// ── Upload ──
function openImport() { document.getElementById("review-file").click(); }

async function handleFile(file) {
  const box = document.getElementById("review-editor-container");
  const summary = document.getElementById("summary-text");
  const tag = document.getElementById("summary-tag");

  // Loading state
  box.innerHTML = `<div style="padding:60px;text-align:center;color:#86868b">
    <div style="width:32px;height:32px;border:3px solid #e5e5e5;border-top-color:#bf953f;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite"></div>
    <div style="font-size:14px">正在解析「${esc(file.name)}」...</div>
  </div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
  summary.textContent = `正在解析「${file.name}」...`;
  tag.textContent = "解析中"; tag.className = "tag tag-accent";

  try {
    if (file.name.match(/\.(docx|doc)$/i)) {
      // Word: send to server for parsing
      const fd = new FormData();
      fd.append("contractFile", file);
      const res = await fetch("/api/contracts/parse", { method:"POST", body: fd });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.text();
      let data; try { data = JSON.parse(raw); } catch { throw new Error("服务器返回异常"); }
      if (data.error) throw new Error(data.error);

      reviewContractText = data.contractText || data.text || "";
      if (!reviewContractText) throw new Error("未提取到合同文本");

      // Display: use contractHtml if available, else plain text
      if (data.contractHtml && data.contractHtml.length > 50) {
        box.innerHTML = `<div style="padding:24px 40px;max-width:820px;margin:0 auto;background:#fff;min-height:400px;font-family:'SimSun','Noto Serif SC',serif;font-size:14px;line-height:2;color:#1d1d1f">${data.contractHtml}</div>`;
      } else {
        showText(reviewContractText);
      }
    } else {
      // Text file: read directly
      reviewContractText = await file.text();
      showText(reviewContractText);
    }

    summary.textContent = `已导入「${file.name}」（${reviewContractText.length} 字），点击"开始审查"。`;
    tag.textContent = "已导入"; tag.className = "tag tag-green";

  } catch(e) {
    console.error("Parse error:", e);
    box.innerHTML = `<div style="padding:60px;text-align:center">
      <div style="font-size:16px;color:#ff3b30;margin-bottom:8px">解析失败</div>
      <div style="font-size:13px;color:#86868b;margin-bottom:20px">${esc(e.message)}</div>
      <button class="btn btn-primary btn-sm" onclick="document.getElementById('review-file').click()">重新选择文件</button>
    </div>`;
    summary.textContent = "解析失败: " + e.message;
    tag.textContent = "失败"; tag.className = "tag tag-red";
  }
}

function showText(text) {
  document.getElementById("review-editor-container").innerHTML =
    `<div style="padding:24px 40px;max-width:820px;margin:0 auto;background:#fff;min-height:400px;font-family:'SimSun','Noto Serif SC',serif;font-size:14px;line-height:2;white-space:pre-wrap;user-select:text;color:#1d1d1f">${esc(text)}</div>`;
}

function copySource() {
  if (!reviewContractText) return alert("暂无合同文本");
  navigator.clipboard.writeText(reviewContractText).then(()=>{
    const b=document.querySelector('[onclick="copySource()"]');
    if(b){b.textContent="已复制 ✓";setTimeout(()=>b.textContent="复制原文",1500);}
  });
}

function pasteText() {
  const t = prompt("请粘贴合同文本：");
  if (t && t.trim()) {
    reviewContractText = t.trim();
    showText(reviewContractText);
    document.getElementById("summary-text").textContent = `已导入合同（${reviewContractText.length} 字），点击"开始审查"。`;
    document.getElementById("summary-tag").textContent = "已导入";
    document.getElementById("summary-tag").className = "tag tag-green";
  }
}

// ── Review ──
async function startReview() {
  if (!reviewContractText) return alert("请先导入合同");
  const btn = document.getElementById("review-btn");
  btn.disabled = true; btn.textContent = "审查中...";
  document.getElementById("score-ai").textContent = "审查中";
  document.getElementById("summary-text").textContent = "正在审查合同，请稍候...";

  try {
    const res = await fetch("/api/contracts/review", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ contractText: reviewContractText, reviewMode:"full" })
    });
    const raw = await res.text();
    let data; try { data = JSON.parse(raw); } catch { throw new Error("服务器返回异常"); }
    if (data.error) throw new Error(data.error);

    reviewIssues = data.issues || [];
    document.getElementById("score-value").textContent = data.score || "--";
    document.getElementById("score-risk").textContent = data.riskLevel || "正常";
    document.getElementById("score-issues").textContent = reviewIssues.length;
    const hi=reviewIssues.filter(i=>i.severity==="high").length;
    const mi=reviewIssues.filter(i=>i.severity==="mid"||i.severity==="medium").length;
    document.getElementById("score-breakdown").textContent = `高 ${hi} / 中 ${mi}`;
    document.getElementById("score-points").textContent = data.reviewPoints || reviewIssues.length;
    document.getElementById("score-ai").textContent = "已完成";
    document.getElementById("summary-text").textContent = data.summary || `发现 ${reviewIssues.length} 个问题`;
    document.getElementById("summary-tag").textContent = reviewIssues.length > 0 ? "有风险" : "通过";
    document.getElementById("summary-tag").className = reviewIssues.length > 0 ? "tag tag-amber" : "tag tag-green";

    renderIssues(reviewIssues);
    if (reviewIssues.length > 0) {
      document.getElementById("issue-nav").style.display = "flex";
      document.getElementById("accept-all-btn").disabled = false;
    }
  } catch(e) {
    document.getElementById("score-ai").textContent = "失败";
    document.getElementById("summary-text").textContent = "审查失败: " + e.message;
  }
  btn.disabled = false; btn.textContent = "开始审查";
}

// ── Issues ──
function renderIssues(issues) {
  const c = document.getElementById("review-issues");
  c.innerHTML = issues.map((issue, i) => {
    const sev = issue.severity==="high"?"high":(issue.severity==="mid"||issue.severity==="medium")?"mid":"low";
    return `<div class="issue-card ${sev}" onclick="focusIssue(${i})" id="issue-${i}">
      <div class="issue-title">${i+1}. ${esc(issue.title||issue.category||"问题")}</div>
      <div class="issue-desc">${esc(issue.description||issue.suggestion||"")}</div>
      ${issue.originalText?`<div class="issue-basis">原文: ${esc(issue.originalText.slice(0,150))}</div>`:""}
      ${issue.suggestion?`<div class="issue-basis" style="background:rgba(191,149,63,0.06)">建议: ${esc(issue.suggestion.slice(0,150))}</div>`:""}
      <div class="issue-actions">
        <button onclick="event.stopPropagation();acceptIssue(${i})">接受</button>
        <button onclick="event.stopPropagation();dismissIssue(${i})">忽略</button>
      </div>
    </div>`;
  }).join("");
  updateCounter();
}

function focusIssue(idx) {
  currentIssueIdx = idx;
  updateCounter();
  document.querySelectorAll(".issue-card").forEach((c,i)=>c.style.outline=i===idx?"2px solid #bf953f":"none");
}
function updateCounter() { document.getElementById("issue-counter").textContent=`${currentIssueIdx+1} / ${reviewIssues.length}`; }
function acceptIssue(i) { const c=document.getElementById(`issue-${i}`); if(c){c.style.opacity="0.4";c.style.textDecoration="line-through";} }
function dismissIssue(i) { const c=document.getElementById(`issue-${i}`); if(c) c.style.display="none"; }

function downloadCorrected() {
  if (!reviewContractText) return;
  const b=new Blob([reviewContractText],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download=`审查后合同_${new Date().toISOString().slice(0,10)}.txt`; a.click();
}

function esc(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
</script>
</body>
</html>
