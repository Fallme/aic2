<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的合同 - ContractAI</title>
  <link rel="stylesheet" href="./knowledge.css">
  <style>
    .mc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
    .mc-header h2{margin-bottom:0;font-size:18px}
    .mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .mc-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;transition:all .2s;cursor:pointer}
    .mc-card:hover{border-color:var(--blue);box-shadow:0 4px 16px rgba(0,0,0,.05)}
    .mc-card h3{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .mc-card .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
    .mc-card .tags{display:flex;flex-wrap:wrap;gap:4px}
    .mc-card .tag{display:inline-flex;padding:2px 6px;border-radius:3px;font-size:10px;border:1px solid}
    .mc-card .actions{display:flex;gap:4px;margin-top:10px}
    .mc-card .actions button{padding:3px 8px;border:1px solid var(--line);border-radius:4px;font-size:11px;cursor:pointer;background:#fff}
    .mc-card .actions button:hover{border-color:var(--blue)}
    .mc-upload{border:2px dashed var(--line);border-radius:8px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;background:#f4f8ff}
    .mc-upload:hover{border-color:var(--blue)}
  </style>
</head>
<body class="workbench-page">
  <aside class="sidebar">
    <a class="brand" href="./home.html" style="text-decoration:none;color:inherit;">
      <span>AI</span>
      <div>
        <strong>ContractAI</strong>
        <small>智能合同管理平台</small>
      </div>
    </a>
    <nav>
      <a href="./contract-generate.html">✍️ 合同起草</a>
      <a href="./contract-review.html">🔍 合同审查</a>
      <a href="./contract-chat.html">💬 合同对话</a>
      <a href="./my-contracts.html" class="active">📁 我的合同</a>
      <a href="./knowledge.html">📚 知识库</a>
    </nav>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1>我的合同</h1>
        <p>管理已上传和已生成的合同文档。</p>
      </div>
      <div class="server-state" id="server-state">检查服务中...</div>
    </header>

    <section class="generate-workbench office-workbench" style="grid-template-columns:1fr">
      <section class="contract-editor-panel panel">
        <div class="mc-header">
          <h2>合同列表</h2>
          <div class="actions">
            <button class="primary" type="button" onclick="document.getElementById('mcFileInput').click()">上传合同</button>
            <input type="file" id="mcFileInput" multiple accept=".doc,.docx,.pdf,.txt" style="display:none" onchange="handleMcUpload(this.files)">
          </div>
        </div>
        <div class="mc-grid" id="mcGrid">
          <div class="mc-upload" onclick="document.getElementById('mcFileInput').click()">
            <div style="font-size:28px;margin-bottom:8px;color:var(--muted)">+</div>
            <div style="font-size:13px;color:var(--muted)">上传新合同</div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
  let myContracts = [];
  window.addEventListener("DOMContentLoaded", () => {
    fetch("/api/health").then(r => r.json()).then(d => {
      const el = document.getElementById("server-state");
      const providerLabel = d.modelProvider && d.modelProvider !== "None" ? `${d.modelProvider} / ` : "";
      el.textContent = d.hasApiKey ? `AI 已配置：${providerLabel}${d.model}` : "服务可用，未配置 API Key";
      el.className = `server-state ${d.hasApiKey ? "ok" : "warn"}`;
    }).catch(() => {
      const el = document.getElementById("server-state");
      el.textContent = "离线";
      el.className = "server-state warn";
    });
    loadMyContracts();
  });

  async function loadMyContracts() {
    try {
      const res = await fetch("/api/my-contracts");
      if (res.ok) { myContracts = await res.json(); renderMyContracts(); }
    } catch {}
  }

  function renderMyContracts() {
    const grid = document.getElementById("mcGrid");
    grid.innerHTML = `<div class="mc-upload" onclick="document.getElementById('mcFileInput').click()"><div style="font-size:28px;margin-bottom:8px;color:var(--muted)">+</div><div style="font-size:13px;color:var(--muted)">上传新合同</div></div>`;
    myContracts.forEach((c, i) => {
      grid.innerHTML += `<div class="mc-card">
        <h3>${esc(c.name)} ${c.starred ? "⭐" : ""}</h3>
        <div class="meta">${esc(c.date || "")} · ${esc(c.type || "通用合同")}</div>
        <div class="tags">
          <span class="tag" style="border-color:var(--line);color:var(--muted)">${esc(c.status || "未审查")}</span>
          ${c.riskLevel ? `<span class="tag" style="border-color:${c.riskLevel === "high" ? "var(--red)" : c.riskLevel === "mid" ? "var(--amber)" : "var(--green)"};color:${c.riskLevel === "high" ? "var(--red)" : c.riskLevel === "mid" ? "var(--amber)" : "var(--green)"}">${c.riskLevel === "high" ? "高风险" : c.riskLevel === "mid" ? "中风险" : "低风险"}</span>` : ""}
        </div>
        <div class="actions">
          <button onclick="reviewContract(${i})">审查</button>
          <button onclick="compareContract(${i})">对比</button>
          <button onclick="starContract(${i})">${c.starred ? "取消收藏" : "收藏"}</button>
          <button onclick="deleteContract(${i})" style="color:var(--red)">删除</button>
        </div>
      </div>`;
    });
  }

  async function handleMcUpload(files) {
    for (const file of files) {
      const fd = new FormData(); fd.append("contractFile", file);
      try {
        const res = await fetch("/api/contracts/parse", { method: "POST", body: fd });
        const txt = await res.text(); let data; try { data = JSON.parse(txt); } catch { data = {}; }
        myContracts.push({ name: file.name, date: new Date().toLocaleDateString("zh-CN"), type: "通用合同", status: "未审查", text: data.contractText || data.text || "", starred: false, riskLevel: null });
      } catch { myContracts.push({ name: file.name, date: new Date().toLocaleDateString("zh-CN"), type: "通用合同", status: "未审查", text: "", starred: false, riskLevel: null }); }
    }
    renderMyContracts();
    saveMyContracts();
  }

  function starContract(i) { myContracts[i].starred = !myContracts[i].starred; renderMyContracts(); saveMyContracts(); }
  function deleteContract(i) { if (confirm("确定删除？")) { myContracts.splice(i, 1); renderMyContracts(); saveMyContracts(); } }
  function reviewContract(i) { window.location.href = "contract-review.html?from=mc&idx=" + i; }
  function compareContract(i) { window.location.href = "contract-compare.html?from=mc&idx=" + i; }
  function saveMyContracts() { try { localStorage.setItem("myContracts", JSON.stringify(myContracts)); } catch {} }
  function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  </script>
</body>
</html>
