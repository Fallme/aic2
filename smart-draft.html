<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能起草 - ContractAI</title>
  <link rel="stylesheet" href="app.css">
  <style>
    /* ── Start: Doubao-style big chat ── */
    .start-page { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:40px 20px; }
    .start-page .hero { text-align:center; margin-bottom:32px; }
    .start-page .hero h1 { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
    .start-page .hero p { color:var(--muted); font-size:14px; margin-top:6px; }

    /* Big input box */
    .big-input { width:100%; max-width:680px; position:relative; }
    .big-input textarea {
      width:100%; min-height:80px; padding:14px 16px;
      border:1.5px solid var(--line-strong); border-radius:var(--r-lg);
      font-size:15px; font-family:var(--font); line-height:1.7; resize:none;
      background:#fff; box-shadow:0 4px 20px rgba(0,0,0,.04);
    }
    .big-input textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 4px 20px rgba(191,149,63,.1); }
    .big-input .input-footer {
      display:flex; align-items:center; justify-content:space-between;
      margin-top:10px;
    }
    .big-input .input-left { display:flex; gap:6px; align-items:center; }
    .big-input .upload-btn {
      width:32px; height:32px; border:none; background:none; color:var(--muted);
      cursor:pointer; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center;
    }
    .big-input .upload-btn:hover { color:var(--accent); background:var(--accent-soft); }
    .big-input .go-btn {
      padding:10px 32px; border:none; border-radius:var(--r-pill);
      background:var(--gold-gradient); color:#fff; font-size:15px; font-weight:700;
      cursor:pointer; font-family:var(--font); transition:all .2s;
      box-shadow:0 2px 12px rgba(191,149,63,.2); letter-spacing:.5px;
    }
    .big-input .go-btn:hover { transform:translateY(-1px); box-shadow:0 4px 20px rgba(191,149,63,.3); }
    .big-input .go-btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

    /* KB checkboxes */
    .kb-checks { display:flex; gap:12px; margin-top:16px; justify-content:center; }
    .kb-check { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none; padding:6px 14px; border-radius:var(--r-pill); border:1.5px solid var(--gray5); background:#fff; transition:all .2s; }
    .kb-check:hover { border-color:var(--gold); }
    .kb-check input[type="checkbox"] { accent-color:var(--gold); width:14px; height:14px; }
    .kb-check.forced { color:var(--gold-dark); font-weight:600; border-color:var(--gold); background:var(--gold-bg); }

    /* Quick templates */
    .quick-tpls { display:flex; gap:6px; margin-top:16px; justify-content:center; flex-wrap:wrap; max-width:680px; }
    .quick-tpl {
      padding:6px 14px; border:1px solid var(--line-strong); border-radius:var(--r-pill);
      font-size:12px; color:var(--muted); cursor:pointer; transition:all .15s; background:#fff;
    }
    .quick-tpl:hover { border-color:var(--accent); color:var(--accent-hover); }
    .quick-tpl.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-hover); }

    /* Attached files */
    .attached-files { display:flex; gap:4px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
    .attached-tag {
      display:flex; align-items:center; gap:4px; padding:4px 10px;
      background:var(--accent-soft); border-radius:var(--r-pill); font-size:11px; color:var(--accent-hover);
    }
    .attached-tag .rm { cursor:pointer; opacity:.6; }
    .attached-tag .rm:hover { opacity:1; }

    /* ── Draft: Left-Right Split ── */
    .draft-page { display:none; flex:1; overflow:hidden; }
    .draft-left { flex:1; display:flex; flex-direction:column; overflow:hidden; padding:16px; gap:8px; }
    .draft-left .doc-header {
      display:flex; align-items:center; justify-content:space-between; padding:0 4px;
    }
    .draft-left .doc-header h3 { font-size:15px; font-weight:600; }
    .draft-left .doc-body {
      flex:1; background:#fff; border:1px solid var(--line); border-radius:var(--r-md);
      overflow-y:auto; padding:0;
    }
    .draft-left .doc-body .contract-content {
      padding:40px 56px; font-family:'SimSun','Noto Serif SC',serif;
      font-size:14px; line-height:2; color:#1d1d1f; max-width:800px; margin:0 auto;
      min-height:100%;
    }
    .contract-content h1 { font-family:'SimHei','Noto Sans SC',sans-serif; font-size:20px; text-align:center; margin:24px 0 16px; }
    .contract-content h2 { font-family:'SimHei','Noto Sans SC',sans-serif; font-size:16px; margin:20px 0 8px; border-bottom:1px solid #eee; padding-bottom:4px; }
    .contract-content h3 { font-family:'SimHei','Noto Sans SC',sans-serif; font-size:14px; margin:14px 0 6px; }
    .contract-content table { border-collapse:collapse; width:100%; margin:12px 0; }
    .contract-content td,.contract-content th { border:1px solid #ccc; padding:6px 10px; font-size:13px; }
    .typing-cursor { display:inline-block; width:2px; height:1em; background:var(--accent); animation:blink .8s infinite; vertical-align:text-bottom; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Agent progress */
    .agent-strip { display:flex; align-items:center; gap:8px; padding:6px 12px; background:var(--glass-solid); border:1px solid var(--line); border-radius:var(--r-sm); font-size:11px; color:var(--muted); }
    .agent-strip .bar { display:flex; gap:3px; flex:1; }
    .agent-strip .bar .s { flex:1; height:3px; border-radius:2px; background:rgba(0,0,0,.06); transition:background .3s; }
    .agent-strip .bar .s.done { background:var(--accent); }
    .agent-strip .bar .s.active { background:var(--accent); animation:shimmer 1.2s infinite; }
    @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.4} }
    .agent-strip .msg { min-width:80px; text-align:right; color:var(--accent-hover); font-weight:500; }

    /* Right chat */
    .draft-right { width:400px; display:flex; flex-direction:column; border-left:1px solid var(--line); background:var(--glass-solid); }
    .draft-right .r-header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .draft-right .r-header h3 { font-size:14px; font-weight:600; }
    .draft-right .r-thread { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }

    /* Guide options row (above input) */
    .opt-row { display:flex; gap:4px; padding:8px 14px 0; }
    .opt-row button {
      flex:1; padding:7px 4px; border:1px solid var(--line-strong); border-radius:var(--r-sm);
      background:#fff; font-size:11px; cursor:pointer; transition:all .15s; font-family:var(--font); color:var(--muted);
    }
    .opt-row button:hover { border-color:var(--accent); color:var(--accent-hover); }

    /* KB row in draft */
    .draft-kb { display:flex; gap:4px; padding:4px 14px 0; flex-wrap:wrap; }
    .draft-kb .kbc { padding:3px 10px; border-radius:var(--r-pill); font-size:10px; border:1px solid var(--line-strong); background:#fff; cursor:pointer; }
    .draft-kb .kbc.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-hover); }

    /* Compose */
    .r-compose { padding:10px 14px 14px; border-top:1px solid var(--line); }
    .r-compose .row { display:flex; gap:6px; align-items:flex-end; }
    .r-compose .row input { flex:1; padding:8px 12px; border:1px solid var(--line-strong); border-radius:var(--r-sm); font-size:13px; font-family:var(--font); }
    .r-compose .row input:focus { outline:none; border-color:var(--accent); }
    .r-compose .row .send { width:32px; height:32px; border:none; border-radius:50%; background:var(--accent-gradient); color:#1d1d1f; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .r-compose .row .clip { width:32px; height:32px; border:none; background:none; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .r-compose .row .clip:hover { color:var(--accent); }
    .r-compose .files { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }

    /* Reference answer buttons */
    .ref-btn {
      padding: 6px 12px; border: 1px solid var(--gray5); border-radius: var(--r-sm);
      background: #fff; font-size: 12px; cursor: pointer; transition: all .15s;
      font-family: var(--font); color: var(--ink);
    }
    .ref-btn:hover { border-color: var(--gold); background: var(--gold-bg); }

    /* Loading spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="ai-status-bar">
  <div class="status-left"><span class="status-dot" id="aiDot"></span><span>AI</span><span class="model-info" id="aiModel">检测中...</span></div>
  <div class="status-right" id="aiProvider"><a href="my-contracts.html">我的合同</a></div>
</div>

<div class="app-layout">
  <aside class="app-sidebar">
    <a class="brand" href="home.html"><div class="logo">AI</div><div class="text"><strong>ContractAI</strong><small>智能合同管理平台</small></div></a>
    <nav>
      <div class="nav-group">
        <div class="nav-group-label">合同起草</div>
        <a class="nav-item active" href="smart-draft.html"><span class="app-icon" id="navSD"></span><span>智能起草</span></a>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <a class="nav-item" href="contract-review.html"><span class="app-icon" id="navCR"></span><span>合同审查</span></a>
        <a class="nav-item" href="contract-compare.html"><span class="app-icon" id="navCC"></span><span>合同对比</span></a>
        <a class="nav-item" href="contract-templates.html"><span class="app-icon" id="navCT"></span><span>合同模板</span></a>
        <a class="nav-item" href="knowledge.html"><span class="app-icon" id="navKB"></span><span>知识库</span></a>
      </div>
    </nav>
  </aside>

  <div class="app-main">
    <!-- ===== START: Big Chat Input ===== -->
    <div class="contract-panel" id="startPage">
      <div class="start-page">
        <div class="hero">
          <h1>智能起草</h1>
          <p>描述需求或选择模板，AI 帮你起草专业合同</p>
        </div>
        <div class="big-input">
          <textarea id="mainInput" placeholder="描述你的合同需求..."></textarea>
          <div class="input-footer">
            <div class="input-left">
              <button class="upload-btn" onclick="document.getElementById('mainFileInput').click()" title="上传参考文件">
                <span class="app-icon" style="width:20px;height:20px" id="icoClip"></span>
              </button>
              <input type="file" id="mainFileInput" multiple accept=".docx,.doc,.pdf,.xlsx,.txt" style="display:none" onchange="addFiles(this.files)">
            </div>
            <button class="go-btn" id="goBtn" onclick="startDraft()">开始起草</button>
          </div>
        </div>
        <!-- Attached files -->
        <div class="attached-files" id="attachedFiles"></div>
        <!-- KB checkboxes -->
        <div class="kb-checks">
          <label class="kb-check forced"><input type="checkbox" checked style="accent-color:var(--gold)"> 通用法规</label>
          <label class="kb-check"><input type="checkbox" id="kbIndustry" checked> 行业惯例</label>
          <label class="kb-check"><input type="checkbox" id="kbEnterprise"> 企业自定</label>
        </div>
        <!-- Contract type selection -->
        <div class="quick-tpls">
          <div class="quick-tpl" onclick="fillExample('帮我起草一份采购合同')">采购合同</div>
          <div class="quick-tpl" onclick="fillExample('帮我起草一份服务合同')">服务合同</div>
          <div class="quick-tpl" onclick="fillExample('帮我起草一份劳动合同')">劳动合同</div>
          <div class="quick-tpl" onclick="fillExample('帮我起草一份软件开发合同')">软件开发合同</div>
          <div class="quick-tpl" onclick="fillExample('帮我起草一份租赁合同')">租赁合同</div>
          <div class="quick-tpl" onclick="fillExample('帮我起草一份销售合同')">销售合同</div>
          <div class="quick-tpl" onclick="fillExample('帮我起草一份咨询合同')">咨询合同</div>
          <div class="quick-tpl" onclick="fillExample('帮我起草一份保密协议')">保密协议</div>
        </div>
        <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:12px">或直接上传文件，AI 会自动分析内容生成合同</p>
      </div>
    </div>

    <!-- ===== DRAFT: Left Word + Right Chat ===== -->
    <div class="draft-page" id="draftPage">
      <div class="draft-left">
        <div class="doc-header">
          <h3 id="docTitle">合同草稿</h3>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="copyDraft()">复制</button>
            <button class="btn btn-outline btn-sm" onclick="downloadDraft()">下载</button>
          </div>
        </div>
        <div class="agent-strip" id="agentStrip" style="display:none">
          <div class="bar"><div class="s" id="as-intent"></div><div class="s" id="as-match"></div><div class="s" id="as-kb"></div><div class="s" id="as-draft"></div><div class="s" id="as-done"></div></div>
          <div class="msg" id="agentMsg">准备中...</div>
        </div>
        <div class="doc-body" id="docBody">
          <div class="contract-content" id="contractContent">
            <div style="text-align:center;color:#999;padding-top:60px">合同内容将在此显示</div>
          </div>
        </div>
      </div>
      <div class="draft-right">
        <div class="r-header"><h3>AI 对话</h3><span class="tag tag-accent" id="statusTag" style="display:none">进行中</span></div>
        <div class="r-thread" id="chatThread">
          <div class="chat-msg assistant"><div class="avatar">AI</div><div class="bubble">请描述合同需求，我会引导你完善。可随时上传文件或补充信息。</div></div>
        </div>
        <div class="r-compose">
          <div class="files" id="draftFiles"></div>
          <div class="row">
            <button class="clip" onclick="document.getElementById('draftFileInput').click()" title="上传附件">
              <span class="app-icon" style="width:18px;height:18px" id="icoClip2"></span>
            </button>
            <input type="file" id="draftFileInput" multiple accept=".docx,.doc,.pdf,.xlsx,.txt" style="display:none" onchange="addDraftFiles(this.files)">
            <input type="text" id="chatInput" placeholder="输入回答或补充信息..." onkeydown="if(event.key==='Enter')sendAnswer()">
            <button class="send" onclick="sendAnswer()" title="发送">
              <span class="app-icon" style="width:16px;height:16px" id="icoSend"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="smart-draft.js"></script>
<script src="model-test.js"></script>
</body>
</html>
