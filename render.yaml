services:
  - type: web
    name: aic2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: XIAOMI_BASE_URL
        value: https://token-plan-cn.xiaomimimo.com/v1
      - key: XIAOMI_MODEL
        value: mimo-v2.5-pro
      - key: XIAOMI_API_KEY
        sync: false
      - key: AI_PROVIDER_PRIORITY
        value: xiaomi,openai,dashscope
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: DASHSCOPE_MODEL
        value: qwen-plus
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
